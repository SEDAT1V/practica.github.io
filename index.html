      -webkit-user-select: none;

    }

      letter-spacing: 0.5px;
    }

      font-weight: 800;

      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle { color: var(--text-muted); font-size: 1.05rem; }

    }

      color: var(--text-main);

      outline: none; 
      transition: 0.2s;

      user-select: text;
    }
    .name-input:focus { border-color: var(--accent-cyan); background: rgba(255, 255, 255, 0.1); }
    
    .quiz-header {
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      margin-bottom: 12px; 
      color: var(--text-muted); 
      font-size: 0.95rem;
    }
    #timer-display { font-weight: 700; color: var(--accent-cyan); font-size: 1.15rem; }

    .progress-bar-container {
      width: 100%; 
      height: 8px; 
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px; 
      margin-bottom: 20px; 
      overflow: hidden;
    }
    .progress-bar-fill { 
      height: 100%; 
      width: 10%; 
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-indigo)); 
      transition: width 0.3s ease; 
    }

      color: var(--accent-indigo);
      font-weight: 600;
      margin-bottom: 10px;
    }
